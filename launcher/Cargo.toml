[package]
name = "fitness-launcher"
version = "0.1.0"
edition = "2021"
description = "Lanceur Windows du serveur local Fitness"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-single-instance = "2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4.0", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
